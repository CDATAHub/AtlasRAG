# AtlasRAG 开发栈（目标态：一键起）。
# 本机 5432 已有 PG 实例时，本栈用 5433 避免端口冲突；
# .env 的 DATABASE_URL 指向实际使用的实例。
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://atlas:atlas@postgres:5432/atlas
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      uv run --no-sync uvicorn src.api.main:app --host 0.0.0.0 --port 8000

volumes:
  pgdata:
