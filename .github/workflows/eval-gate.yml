name: eval-gate

# 章程 II 分层门禁（T046）：PR 必须过 mock 化测试 + 闭卷集检索评测
on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://atlas:atlas@localhost:5433/atlas_test
      DATABASE_URL: postgresql+asyncpg://atlas:atlas@localhost:5433/atlas_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Enable pgvector
        run: |
          PGPASSWORD=atlas psql -h localhost -U atlas -d atlas_test -c "CREATE EXTENSION IF NOT EXISTS vector;" || true
        env:
          PGPASSWORD: atlas
      - run: uv sync --dev
      - name: Unit + integration + contract tests（mock 化，无真实外部服务）
        run: uv run pytest -q

  eval-gate:
    # 闭卷集检索评测：仅 Embedding + Rerank 真实调用（无 LLM 生成），
    # Recall@5 < 0.8 → 非零退出码 → 阻断合并（ADR-007）
    # 分层口径（章程 II / 阶段 2 T044）：PR 门禁维持「首轮确定性指标」（无 LLM）；
    # `--loop` 回环评测（plan/reflect 真调 LLM，SC-002 repair_rate ≥ 0.3）
    # 属 nightly / 发布前分层，不在 PR 门禁执行——成本与稳定性考虑。
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'pull_request'
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
      LLM_MODEL: qwen3.7-flash
      EMBEDDING_MODEL: qwen3.7-text-embedding
      RERANK_MODEL: qwen3.7-text-rerank
      RERANK_ENDPOINT: https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank
      DATABASE_URL: postgresql+asyncpg://atlas:atlas@localhost:5433/atlas
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U atlas"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Seed corpus（102 份 kaihe 条款，仅 Embedding 调用）
        run: uv run python scripts/init_db.py && uv run python scripts/import_corpus.py
      - name: Retrieval eval gate（Recall@5 ≥ 0.8）
        run: uv run python scripts/run_retrieval_eval.py --output report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: report.json
